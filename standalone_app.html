    function formatThaiDate(isoString, full = false) {
      try {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return '-';
        const day = d.getDate();
        const monthIndex = d.getMonth();
        const yearThai = d.getFullYear() + 543;
        const thaiMonthsShort = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const thaiMonthsFull = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        const thaiDays = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];
        if (full) return `${thaiDays[d.getDay()]}ที่ ${day} ${thaiMonthsFull[monthIndex]} พ.ศ. ${yearThai}`;
        return `${day} ${thaiMonthsShort[monthIndex]} ${yearThai}`;
      } catch { return '-'; }
    }

    function formatThaiTime(isoString) {
      try {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return '-';
        return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')} น.`;
      } catch { return '-'; }
    }

    function isSameDay(d1, d2) {
      const a = new Date(d1);
      const b = new Date(d2);
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function compressImage(file, maxWidth = 1200, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function generateLineSummary(records, dateFormatted) {
      const passCount = records.filter(r => r.status === 'pass').length;
      const failCount = records.filter(r => r.status === 'fail').length;
      let text = `📋 รายงานผลการตรวจเขตทำความสะอาด\n`;
      text += `🏫 โรงเรียนระโนดวิทยา (สพม.สงขลา สตูล)\n`;
      text += `📅 ประจำ${dateFormatted}\n`;
      text += `⏰ ตรวจบันทึกแล้วทั้งหมด: ${records.length} เขต\n`;
      text += `-------------------------\n`;
      text += `✅ ผ่านเกณฑ์: ${passCount} เขต\n`;
      text += `❌ ไม่ผ่านเกณฑ์: ${failCount} เขต\n`;
      if (failCount > 0) {
        text += `\n⚠️ เขตที่ต้องปรับปรุงแก้ไขด่วน:\n`;
        records.filter(r => r.status === 'fail').forEach((item, idx) => {
          text += `${idx + 1}. ${item.zoneName} (${item.assignedClass || 'ไม่ระบุห้อง'})\n`;
          text += `   - ปัญหา: ${item.note || 'ไม่ระบุหมายเหตุ'}\n`;
          text += `   - ผู้ตรวจ: ${item.inspectorName}\n`;
        });
        text += `\n* ขอความร่วมมือนักเรียนช่วยกำกับดูแลแก้ไขให้เรียบร้อยครับ/ค่ะ 🙏`;
      } else if (records.length > 0) {
        text += `\n✨ ทุกเขตพื้นที่สะอาดเรียบร้อยตามมาตรฐาน ขอขอบคุณนักเรียนทุกคนครับ/ค่ะ 🌟`;
      } else {
        text += `\n(ยังไม่มีรายการตรวจบันทึกสำหรับวันนี้)`;
      }
      return text;
    }

    function exportToCSV(records, filename = 'ranot_inspections.csv') {
      const headers = ['วันที่', 'เวลา', 'เขตพื้นที่', 'ชั้นเรียนรับผิดชอบ', 'สถานะ', 'ผู้ประเมิน', 'หมายเหตุ'];
      const rows = records.map(r => [
        formatThaiDate(r.date),
        formatThaiTime(r.date),
        `"${r.zoneName.replace(/"/g, '""')}"`,
        `"${(r.assignedClass || '').replace(/"/g, '""')}"`,
        r.status === 'pass' ? 'ผ่าน' : 'ไม่ผ่าน',
        `"${r.inspectorName.replace(/"/g, '""')}"`,
        `"${(r.note || '').replace(/"/g, '""')}"`
      ]);
      const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(row => row.join(','))].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

                  <button

                <textarea

                  value={note}

    // --- TAB: DAILY REPORT ---
    function DailyTab({ inspections, todayInspections, onDelete, onToggleResolved, onViewImage, isAdminAuthenticated, onOpenAdminLogin, onResetToday }) {
      const [copied, setCopied] = useState(false);
      const [search, setSearch] = useState('');
      const today = new Date();
      const formattedToday = formatThaiDate(today.toISOString(), true);

      const filtered = todayInspections.filter(r => {
        if (!search.trim()) return true;
        const s = search.toLowerCase();
        return r.zoneName.toLowerCase().includes(s) || (r.assignedClass || '').toLowerCase().includes(s) || r.inspectorName.toLowerCase().includes(s) || (r.note || '').toLowerCase().includes(s);
      });

      const passCount = todayInspections.filter(r => r.status === 'pass').length;
      const failCount = todayInspections.filter(r => r.status === 'fail').length;

      const handleCopy = () => {
        const text = generateLineSummary(todayInspections, formattedToday);
        navigator.clipboard.writeText(text).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 3000);
        });
      };

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-2xl p-5 shadow-xs border border-slate-200 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold text-blue-900">📅 สรุปผลการตรวจประจำวัน</h2>
              <p className="text-xs text-slate-500 mt-0.5">{formattedToday}</p>
            </div>
            <div className="flex flex-wrap items-center gap-2 print:hidden">
              <button
                onClick={handleCopy}
                className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100 transition"
              >
                {copied ? '✓ คัดลอกแล้ว!' : '📋 คัดลอกส่ง LINE'}
              </button>
              <button
                onClick={() => exportToCSV(todayInspections, `ranot_daily_${today.toISOString().slice(0,10)}.csv`)}
                className="px-3 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200"
              >
                📥 ส่งออก CSV
              </button>
              <button
                onClick={() => window.print()}
                className="px-3 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200"
              >
                🖨️ พิมพ์
              </button>
              <button
                onClick={() => {
                  if (!isAdminAuthenticated) { onOpenAdminLogin(); return; }
                  if (confirm('คุณต้องการรีเซ็ตผลการตรวจของวันนี้ทั้งหมดใช่หรือไม่?')) onResetToday();
                }}
                className={`px-3 py-2 rounded-xl text-xs font-semibold border ${isAdminAuthenticated ? 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100' : 'bg-slate-100 text-slate-600 border-slate-200'}`}
              >
                🔄 {isAdminAuthenticated ? 'รีเซ็ตผลตรวจวันนี้' : 'รีเซ็ตผล (แอดมิน)'}
              </button>
            </div>
          </div>

          {/* Metrics */}
          <div className="grid grid-cols-3 gap-3">
            <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
              <p className="text-xs text-slate-500">ตรวจแล้ววันนี้</p>
              <p className="text-2xl font-bold text-slate-800 mt-1">{todayInspections.length}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
              <p className="text-xs text-emerald-600">ผ่านเกณฑ์</p>
              <p className="text-2xl font-bold text-emerald-600 mt-1">{passCount}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
              <p className="text-xs text-rose-600">ต้องปรับปรุง</p>
              <p className="text-2xl font-bold text-rose-600 mt-1">{failCount}</p>
            </div>
          </div>

          {/* Search */}
          <div className="flex justify-between items-center print:hidden">
            <input
              type="text"
              placeholder="ค้นหาเขต ชั้นเรียน หรือผู้ตรวจ..."
              value={search}
              onChange={e => setSearch(e.target.value)}
              className="p-2 text-xs bg-white border border-slate-200 rounded-xl w-64 outline-none"
            />
          </div>

          {/* Table */}
          <div className="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
            {filtered.length === 0 ? (
              <div className="p-12 text-center text-slate-400 text-xs">
                {todayInspections.length === 0 ? 'ยังไม่มีข้อมูลการตรวจบันทึกสำหรับวันนี้' : 'ไม่พบข้อมูลที่ตรงกับคำค้นหา'}
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-xs text-left">
                  <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                    <tr>
                      <th className="py-3 px-4">เวลา</th>
                      <th className="py-3 px-4">เขตพื้นที่ / ห้องเรียน</th>
                      <th className="py-3 px-4">สถานะ</th>
                      <th className="py-3 px-4">ผู้ตรวจ</th>
                      <th className="py-3 px-4">หมายเหตุ / หลักฐาน</th>
                      <th className="py-3 px-4 text-right print:hidden">จัดการ</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filtered.map(r => (
                      <tr key={r.id} className="hover:bg-slate-50/70">
                        <td className="py-3 px-4 text-slate-500 whitespace-nowrap">{formatThaiTime(r.date)}</td>
                        <td className="py-3 px-4">
                          <p className="font-bold text-slate-800">{r.zoneName}</p>
                          <span className="text-[11px] text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">ห้อง {r.assignedClass}</span>
                        </td>
                        <td className="py-3 px-4">
                          {r.status === 'pass' ? (
                            <span className="bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full font-bold">✓ ผ่าน</span>
                          ) : (
                            <span className="bg-rose-100 text-rose-800 px-2 py-1 rounded-full font-bold">✕ ไม่ผ่าน</span>
                          )}
                        </td>
                        <td className="py-3 px-4 text-slate-600">{r.inspectorName}</td>
                        <td className="py-3 px-4">
                          <p className={r.status === 'fail' ? 'text-rose-700 font-semibold' : 'text-slate-600'}>
                            {r.note || '-'}
                          </p>
                          {r.image && (
                            <button
                              onClick={() => onViewImage(r.image, r.zoneName)}
                              className="mt-1 text-[11px] text-blue-600 hover:underline flex items-center gap-1 font-medium"
                            >
                              📷 ดูภาพหลักฐาน
                            </button>
                          )}
                        </td>
                        <td className="py-3 px-4 text-right print:hidden space-x-1 whitespace-nowrap">
                          {r.status === 'fail' && (
                            <button
                              onClick={() => onToggleResolved(r.id)}
                              className={`p-1.5 rounded-lg text-xs ${r.resolved ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}
                              title={r.resolved ? 'แก้ไขแล้ว' : 'ทำเครื่องหมายว่าแก้ไขแล้ว'}
                            >
                              ✓
                            </button>
                          )}
                          <button
                            onClick={() => { if(confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) onDelete(r.id); }}
                            className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg"
                            title="ลบ"
                          >
                            🗑️
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- TAB: MONTHLY & ANALYTICS ---
    function MonthlyTab({ inspections, zones, onDelete, onViewImage, isAdminAuthenticated, onOpenAdminLogin, onResetAll }) {
      const [timeRange, setTimeRange] = useState('all');
      const now = new Date();

      const filtered = inspections.filter(r => {
        const d = new Date(r.date);
        if (timeRange === 'last7Days') return d >= new Date(now.getTime() - 7 * 86400000);
        if (timeRange === 'thisMonth') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        return true;
      });

      const passCount = filtered.filter(r => r.status === 'pass').length;
      const rate = filtered.length > 0 ? Math.round((passCount / filtered.length) * 100) : 0;

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-2xl p-5 shadow-xs border border-slate-200 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold text-blue-900">📊 สรุปผลรายเดือนและสถิติภาพรวม</h2>
              <p className="text-xs text-slate-500">สถิติความสะอาด โรงเรียนระโนดวิทยา</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <div className="bg-slate-100 p-1 rounded-xl flex text-xs">
                {['all', 'thisMonth', 'last7Days'].map(t => (
                  <button
                    key={t}
                    onClick={() => setTimeRange(t)}
                    className={`px-3 py-1.5 rounded-lg ${timeRange === t ? 'bg-white text-blue-800 font-bold shadow-xs' : 'text-slate-600'}`}
                  >
                    {t === 'all' ? 'ทั้งหมด' : t === 'thisMonth' ? 'เดือนนี้' : '7 วันล่าสุด'}
                  </button>
                ))}
              </div>
              <button
                onClick={() => exportToCSV(filtered, `ranot_stats_${timeRange}.csv`)}
                className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200"
              >
                📥 ดาวน์โหลด CSV
              </button>
              <button
                onClick={() => {
                  if (!isAdminAuthenticated) { onOpenAdminLogin(); return; }
                  if (confirm('คุณต้องการรีเซ็ตประวัติการตรวจและสถิติทั้งหมดใช่หรือไม่?')) onResetAll();
                }}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold border ${isAdminAuthenticated ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-slate-100 text-slate-600'}`}
              >
                🔄 {isAdminAuthenticated ? 'รีเซ็ตสถิติทั้งหมด' : 'รีเซ็ตสถิติ (แอดมิน)'}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
              <p className="text-xs text-slate-500">บันทึกทั้งหมด</p>
              <p className="text-2xl font-bold text-slate-800 mt-1">{filtered.length} ครั้ง</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
              <p className="text-xs text-emerald-600">ผ่านเกณฑ์</p>
              <p className="text-2xl font-bold text-emerald-600 mt-1">{passCount} ครั้ง</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
              <p className="text-xs text-blue-600">อัตราความสะอาด</p>
              <p className="text-2xl font-bold text-blue-800 mt-1">{rate}%</p>
            </div>
          </div>

          {/* List of inspections */}
          <div className="bg-white rounded-2xl shadow-xs border border-slate-200 p-5">
            <h3 className="font-bold text-xs uppercase tracking-wider text-slate-600 mb-3">ประวัติการตรวจย้อนหลัง</h3>
            {filtered.length === 0 ? (
              <p className="text-xs text-slate-400 py-8 text-center">ไม่มีข้อมูลในช่วยเวลาที่เลือก</p>
            ) : (
              <div className="divide-y divide-slate-100 max-h-96 overflow-y-auto text-xs">
                {filtered.map(r => (
                  <div key={r.id} className="py-2.5 flex justify-between items-center gap-2">
                    <div>
                      <p className="font-bold text-slate-800">{r.zoneName} ({r.assignedClass})</p>
                      <p className="text-[11px] text-slate-400">{formatThaiDate(r.date)} {formatThaiTime(r.date)} โดย {r.inspectorName}</p>
                      {r.note && <p className="text-rose-600 text-[11px] mt-0.5">{r.note}</p>}
                    </div>
                    <div className="flex items-center gap-2">
                      <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] ${r.status === 'pass' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                        {r.status === 'pass' ? 'ผ่าน' : 'ไม่ผ่าน'}
                      </span>
                      {r.image && (
                        <button onClick={() => onViewImage(r.image, r.zoneName)} className="text-blue-600 hover:underline text-[11px]">
                          📷 ภาพ
                        </button>
                      )}
                      <button onClick={() => { if(confirm('ต้องการลบรายการนี้?')) onDelete(r.id); }} className="text-slate-400 hover:text-red-600 p-1">
                        🗑️
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- TAB: ZONES MANAGEMENT ---

      const [search, setSearch] = useState('');
      const [showAdd, setShowAdd] = useState(false);
      const [editingZone, setEditingZone] = useState(null);
      const [showMapModal, setShowMapModal] = useState(false);

      // Add Form
      const [name, setName] = useState('');
      const [assignedClass, setAssignedClass] = useState('');
      const [locationArea, setLocationArea] = useState('');
      const [advisorTeacher, setAdvisorTeacher] = useState('');
      const [description, setDescription] = useState('');

      const filtered = zones.filter(z => {
        if (!search.trim()) return true;
        const s = search.toLowerCase();
        return z.name.toLowerCase().includes(s) || z.assignedClass.toLowerCase().includes(s);
      });

      const handleAddSubmit = (e) => {
        e.preventDefault();

          name: name.trim(),
          assignedClass: assignedClass.trim(),
          locationArea: locationArea.trim() || 'บริเวณในโรงเรียนระโนดวิทยา',
          advisorTeacher: advisorTeacher.trim() || 'ครูประจำชั้น',
          description: description.trim() || undefined
        });
        setName(''); setAssignedClass(''); setLocationArea(''); setAdvisorTeacher(''); setDescription('');
        setShowAdd(false);
      };

      const handleEditSubmit = (e) => {
        e.preventDefault();
        onUpdateZone(editingZone);
        setEditingZone(null);
      };

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-2xl p-5 shadow-xs border border-slate-200 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold text-blue-900">📍 ผังเขตพื้นที่ทำความสะอาด ({zones.length} เขต)</h2>
              <p className="text-xs text-slate-500">โรงเรียนระโนดวิทยา จัดแบ่งเขตตามห้องเรียน</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <input
                type="text"
                placeholder="ค้นหาเขต หรือห้องเรียน..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="p-2 text-xs bg-slate-50 border border-slate-200 rounded-xl w-48 outline-none"
              />
              <button
                onClick={() => {
                  if (!isAdminAuthenticated) { onOpenAdminLogin(); return; }
                  setShowAdd(true);
                }}
                className="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-xs font-semibold rounded-xl transition"
              >
                + {isAdminAuthenticated ? 'เพิ่มเขตพื้นที่ใหม่' : 'เพิ่มเขต (แอดมิน)'}
              </button>
            </div>
          </div>

          {/* Master Zone Map Card */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div className="p-4 bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-950 text-white flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <span className="text-2xl">🗺️</span>
                <div>
                  <h3 className="font-bold text-sm sm:text-base leading-tight">แผนผังเขตพื้นที่ทำความสะอาด โรงเรียนระโนดวิทยา</h3>
                  <p className="text-xs text-blue-200/80">แผนผังรวมแสดงตำแหน่งเขตรับผิดชอบของ ม.1 - ม.6 และ ปวช.</p>
                </div>
              </div>
              <button
                onClick={() => setShowMapModal(true)}
                className="flex items-center gap-1.5 px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold shadow-xs transition cursor-pointer self-start sm:self-auto"
              >
                <span>🔍 ขยายดูแผนผังขนาดเต็ม</span>
              </button>
            </div>
            <div
              className="relative group bg-slate-100 flex items-center justify-center p-2 sm:p-4 cursor-pointer overflow-hidden max-h-[460px]"
              onClick={() => setShowMapModal(true)}
              title="คลิกเพื่อดูรูปภาพแผนผังขนาดเต็ม"
            >
              <img
                src="./school_zone_map.jpg"
                onError={(e) => { e.target.onerror=null; e.target.src='/school_zone_map.jpg'; }}
                alt="แผนผังเขตพื้นที่ทำความสะอาด โรงเรียนระโนดวิทยา"
                className="w-full max-h-[420px] object-contain rounded-xl shadow-xs transition duration-300 group-hover:scale-[1.01]"
              />
              <div className="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition duration-200 flex items-center justify-center gap-2 text-white font-bold text-sm backdrop-blur-xs">
                <span>🔍 คลิกเพื่อดูแผนผังขนาดใหญ่ (Full View)</span>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(z => (
              <div key={z.id} className="bg-white rounded-2xl p-5 shadow-xs border border-slate-200 hover:border-blue-300 transition flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-start">
                    <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2.5 py-1 rounded-lg">ห้อง {z.assignedClass}</span>
                    {isAdminAuthenticated && (
                      <div className="space-x-1">
                        <button onClick={() => setEditingZone(z)} className="text-slate-400 hover:text-blue-600 p-1" title="แก้ไข">✏️</button>
                        <button onClick={() => { if(confirm(`ต้องการลบ ${z.name}?`)) onDeleteZone(z.id); }} className="text-slate-400 hover:text-red-600 p-1" title="ลบ">🗑️</button>
                      </div>
                    )}
                  </div>
                  <h3 className="font-bold text-slate-800 text-base mt-2.5">{z.name}</h3>
                  <p className="text-xs text-slate-400 mt-1">{z.locationArea}</p>
                  <p className="text-xs text-slate-600 mt-3 border-t pt-2">ครูที่ปรึกษา: <strong>{z.advisorTeacher}</strong></p>
                </div>
                <button
                  onClick={() => onInspectZone(z.id)}
                  className="mt-4 w-full py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold text-xs rounded-xl transition"
                >
                  📝 บันทึกตรวจเขตนี้ทันที
                </button>
              </div>
            ))}
          </div>

          {/* Add Zone Modal */}
          {showAdd && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">เพิ่มเขตพื้นที่ทำความสะอาด</h3>
                  <button onClick={() => setShowAdd(false)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={handleAddSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">ชื่อเขตพื้นที่ *</label>
                    <input type="text" required value={name} onChange={e => setName(e.target.value)} placeholder="เช่น เขตพื้นที่ ม.1/1" className="w-full p-2 border rounded-lg bg-slate-50" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">ห้องที่รับผิดชอบ *</label>
                      <input type="text" required value={assignedClass} onChange={e => setAssignedClass(e.target.value)} placeholder="เช่น ม.1/1" className="w-full p-2 border rounded-lg bg-slate-50" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">บริเวณ / อาคาร</label>
                      <input type="text" value={locationArea} onChange={e => setLocationArea(e.target.value)} placeholder="เช่น บริเวณหน้าเสาธง" className="w-full p-2 border rounded-lg bg-slate-50" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">ครูที่ปรึกษา</label>
                    <input type="text" value={advisorTeacher} onChange={e => setAdvisorTeacher(e.target.value)} placeholder="ชื่อครูที่ปรึกษา" className="w-full p-2 border rounded-lg bg-slate-50" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setShowAdd(false)} className="px-3 py-1.5 text-slate-500">ยกเลิก</button>
                    <button type="submit" className="px-4 py-1.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg">บันทึก</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Edit Zone Modal */}
          {editingZone && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">แก้ไขเขตพื้นที่</h3>
                  <button onClick={() => setEditingZone(null)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={handleEditSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">ชื่อเขตพื้นที่ *</label>
                    <input type="text" required value={editingZone.name} onChange={e => setEditingZone({...editingZone, name: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">ห้องที่รับผิดชอบ *</label>
                      <input type="text" required value={editingZone.assignedClass} onChange={e => setEditingZone({...editingZone, assignedClass: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">บริเวณ / อาคาร</label>
                      <input type="text" value={editingZone.locationArea} onChange={e => setEditingZone({...editingZone, locationArea: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">ครูที่ปรึกษา</label>
                    <input type="text" value={editingZone.advisorTeacher} onChange={e => setEditingZone({...editingZone, advisorTeacher: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setEditingZone(null)} className="px-3 py-1.5 text-slate-500">ยกเลิก</button>
                    <button type="submit" className="px-4 py-1.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg">บันทึกการแก้ไข</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Fullscreen Map Modal */}
          {showMapModal && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/85 backdrop-blur-sm"
              onClick={() => setShowMapModal(false)}
            >
              <div
                className="relative bg-white rounded-2xl max-w-5xl w-full p-4 sm:p-5 shadow-2xl border border-slate-200 flex flex-col max-h-[92vh]"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🗺️</span>
                    <div>
                      <h3 className="font-bold text-slate-900 text-sm sm:text-base">
                        แผนผังเขตพื้นที่ทำความสะอาด โรงเรียนระโนดวิทยา
                      </h3>
                      <p className="text-xs text-slate-500">
                        แสดงผังการจัดแบ่งเขตพื้นที่ทำความสะอาด ม.1 - ม.6 และ ปวช.
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowMapModal(false)}
                    className="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="mt-3 flex-1 overflow-auto bg-slate-100 rounded-xl p-2 flex items-center justify-center">
                  <img
                    src="./school_zone_map.jpg"
                    onError={(e) => { e.target.onerror=null; e.target.src='/school_zone_map.jpg'; }}
                    alt="แผนผังเขตพื้นที่ทำความสะอาด โรงเรียนระโนดวิทยา"
                    className="max-w-full max-h-[75vh] object-contain rounded-lg shadow-sm"
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- MODAL: ADMIN LOGIN ---
    function AdminLoginModal({ validPassword, onClose, onSuccess }) {
      const [pwd, setPwd] = useState('');
      const [error, setError] = useState(false);
      const [show, setShow] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (pwd === validPassword) {
          onSuccess();
        } else {
          setError(true);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" onClick={onClose}>
          <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center pb-3 border-b mb-4">
              <div className="flex items-center gap-2">
                <span className="text-xl">🛡️</span>
                <h3 className="font-bold text-sm text-slate-800">เข้าสู่ระบบแอดมิน</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>

            {error && (
              <div className="mb-3 p-2.5 bg-red-50 border border-red-200 text-red-700 rounded-xl text-xs">
                รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">รหัสผ่านผู้ดูแลระบบ</label>
                <div className="relative">
                  <input
                    type={show ? 'text' : 'password'}
                    required
                    autoFocus
                    placeholder="กรอกรหัสผ่านแอดมิน"
                    value={pwd}
                    onChange={e => { setPwd(e.target.value); setError(false); }}
                    className="w-full p-2.5 pr-10 text-xs bg-slate-50 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <button
                    type="button"
                    onClick={() => setShow(!show)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
                  >
                    {show ? '🙈' : '👁️'}
                  </button>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onClick={onClose} className="px-4 py-2 text-xs text-slate-600">ยกเลิก</button>
                <button type="submit" className="px-5 py-2 text-xs font-bold bg-blue-700 hover:bg-blue-800 text-white rounded-xl shadow">เข้าสู่ระบบ</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MODAL: ADMIN SETTINGS ---
    function AdminSettingsModal({ adminPassword, onClose, onUpdatePassword, onLogout, onResetDemo, onClearInspections, inspections, zones }) {
      const [oldP, setOldP] = useState('');
      const [newP, setNewP] = useState('');
      const [confP, setConfP] = useState('');
      const [msg, setMsg] = useState(null);

      const handleChangePassword = (e) => {
        e.preventDefault();
        setMsg(null);
        if (oldP !== adminPassword) { setMsg({ err: 'รหัสผ่านเดิมไม่ถูกต้อง' }); return; }
        if (newP.length < 4) { setMsg({ err: 'รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร' }); return; }
        if (newP !== confP) { setMsg({ err: 'รหัสผ่านใหม่ไม่ตรงกัน' }); return; }
        onUpdatePassword(newP);
        setOldP(''); setNewP(''); setConfP('');
      };

      const handleExportJSON = () => {
        const backupData = { system: 'Ranot Wittaya School Cleaning System', backupDate: new Date().toISOString(), zones, inspections };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ranot_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" onClick={onClose}>
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center pb-3 border-b mb-4">
              <div className="flex items-center gap-2">
                <span className="text-xl">⚙️</span>
                <h3 className="font-bold text-sm text-slate-800">การจัดการระบบแอดมิน</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>

            {msg && msg.err && <div className="p-2.5 bg-red-50 text-red-700 text-xs rounded-xl mb-3">{msg.err}</div>}

            <form onSubmit={handleChangePassword} className="space-y-2.5 text-xs">
              <h4 className="font-bold text-slate-700">เปลี่ยนรหัสผ่านแอดมิน</h4>
              <input type="password" required placeholder="รหัสผ่านปัจจุบัน" value={oldP} onChange={e => setOldP(e.target.value)} className="w-full p-2 border rounded-lg bg-slate-50" />
              <div className="grid grid-cols-2 gap-2">
                <input type="password" required placeholder="รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)" value={newP} onChange={e => setNewP(e.target.value)} className="w-full p-2 border rounded-lg bg-slate-50" />
                <input type="password" required placeholder="ยืนยันรหัสผ่านใหม่" value={confP} onChange={e => setConfP(e.target.value)} className="w-full p-2 border rounded-lg bg-slate-50" />
              </div>
              <button type="submit" className="w-full py-2 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg shadow-xs">
                บันทึกรหัสผ่านใหม่
              </button>
            </form>

            <div className="mt-5 pt-4 border-t space-y-2 text-xs">
              <h4 className="font-bold text-slate-700">การสำรองและรีเซ็ตระบบ</h4>
              <button onClick={handleExportJSON} className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg">
                📥 ดาวน์โหลดไฟล์สำรองข้อมูล (JSON)
              </button>
              <button onClick={() => { onResetDemo(); onClose(); }} className="w-full py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 font-semibold rounded-lg">
                🔄 คืนค่าข้อมูลเริ่มต้นโรงเรียน (Reset Demo Data)
              </button>
              <button onClick={() => { if(confirm('ต้องการล้างประวัติการตรวจทั้งหมดใช่หรือไม่?')) { onClearInspections(); onClose(); } }} className="w-full py-2 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 font-semibold rounded-lg">
                🗑️ ล้างประวัติการตรวจทั้งหมด ({inspections.length} รายการ)
              </button>
            </div>

            <div className="mt-5 pt-3 border-t flex justify-between items-center text-xs">
              <span className="text-slate-400">สถานะ: ผู้ดูแลระบบ</span>
              <button onClick={onLogout} className="text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg font-bold border border-red-200">
                ออกจากระบบแอดมิน
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
